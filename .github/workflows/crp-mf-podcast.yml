name: CRP MF Podcast Audio Preparation
run-name: crp-mf-podcast-${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      file_id:
        required: true
        type: string
      job_id:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: crp-mf-podcast-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install gdown==5.2.0
      - name: Extract original MF audio into a private draft release
        env:
          FILE_ID: ${{ inputs.file_id }}
          JOB_ID: ${{ inputs.job_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python .github/scripts/prepare_mf_podcast.py

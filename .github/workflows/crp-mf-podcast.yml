name: CRP MF Podcast Audio Preparation
run-name: crp-mf-podcast-${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      file_id:
        required: true
        type: string
      source_asset_url:
        required: false
        type: string
      job_id:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: crp-mf-podcast-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo timeout 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a timeout 240s apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install --timeout 30 gdown==5.2.0
      - name: Extract original MF audio into a private draft release
        env:
          SOURCE_ASSET_URL: ${{ inputs.source_asset_url }}
          FILE_ID: ${{ inputs.file_id }}
          JOB_ID: ${{ inputs.job_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python .github/scripts/prepare_mf_podcast.py


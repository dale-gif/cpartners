# =============================================================================
# CRP Audio Mix - podcast music bed engine
# =============================================================================
# Lays the show theme around a finished voice track: a 33-second intro that blends
# down into her opening, then a bed that enters under the closing lines, swells when
# the last word ends, carries the sung "Cash Flow Show / Situation Room" chorus, and
# fades out in the gap before the next verse. Returns one loudness-normalised MP3.
#
# Every timing number lives in .github/scripts/mix_episode.py. This file passes NONE
# of them - see the note on the mix_args input for why that is deliberate.
#
# WHY workflow_dispatch AND NOT repository_dispatch
# -------------------------------------------------
# The ten MF/SF video watchers in n8n find their render by polling
#     GET /actions/runs?event=repository_dispatch&per_page=5
# and taking the NEWEST run in a 60-second window. They cannot tell one dispatch
# from another, so an audio job firing repository_dispatch could become the
# "newest run" a video watcher latches onto - and that watcher would publish an
# MP3 in place of its video.
#
# A run's event is set by how it was TRIGGERED, not by what the workflow declares
# (render.yml declares both and is unaffected). Verified live: filtering all
# workflows by event:repository_dispatch returns 95 runs, every one crp-render,
# with an audio run executing at the same time and absent from the list.
#
# Do not change this trigger.
#
# All the audio logic lives in .github/scripts/mix_episode.py so it can be run
# against real files locally before it is trusted here. Two attempts at doing it
# inline in YAML broke on block-scalar indentation and shell quoting.
# =============================================================================

name: CRP Audio Mix

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Asset ID, e.g. CRP-SR-EP02. Becomes the release tag.'
        required: true
        type: string
      voice_url:
        description: 'Direct-download URL for the voice MP3. Blank if using voice_release_tag.'
        required: false
        type: string
      voice_release_tag:
        description: 'Private alternative to voice_url - a release tag holding voice.mp3.'
        required: false
        type: string
      theme:
        description: 'Theme track path in this repo.'
        required: false
        default: 'assets/audio/cashflow_theme.mp3'
        type: string
      # ONE free-form override input, deliberately, instead of one input per knob.
      #
      # This file used to carry its own copies of hook_at / hook_delay /
      # outro_lead_in / headroom as defaults. That is how the 2026-08-28 defect
      # happened: mix_episode.py was retuned to Larry's spec, these defaults were
      # not, and because n8n dispatches with only asset_id and voice_url, THESE
      # stale numbers won every run. hook_at 14.96 / hook_delay 10.0 put the outro
      # bed 4.96s into the song, which slid the whole fade 4.96s later and ended
      # the episode 5.4s INTO the 2:03 verse - precisely the fault Larry reported.
      #
      # A default that silently overrides the tuned value is worse than no input at
      # all. So mix_episode.py is now the single source of truth for every number,
      # and this passes nothing unless a human deliberately types it.
      mix_args:
        description: >-
          Optional flags appended verbatim to mix_episode.py, for one-off tuning
          only. Blank means use the tuned defaults in the script - which is what
          every automated run should do. Example: --intro-hold 40 --fade-start 100
        required: false
        default: ''
        type: string

# Serialise per asset so one episode never mixes twice at once, while different
# episodes still run in parallel. Deliberately NOT a global group with
# cancel-in-progress, which would have concurrent episodes killing each other.
concurrency:
  group: crp-audio-${{ inputs.asset_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mix:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repo (theme and scripts)
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Fetch the voice track
        env:
          VOICE_URL: ${{ inputs.voice_url }}
          VOICE_TAG: ${{ inputs.voice_release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${VOICE_URL}" ]; then
            echo "Downloading voice from URL"
            curl -fsSL --retry 3 --retry-delay 5 -o voice_raw.mp3 "${VOICE_URL}"
          elif [ -n "${VOICE_TAG}" ]; then
            echo "Downloading voice from release ${VOICE_TAG}"
            gh release download "${VOICE_TAG}" --pattern 'voice.mp3' --output voice_raw.mp3 --clobber
          else
            echo "::error::Supply either voice_url or voice_release_tag."
            exit 1
          fi
          # A failed Drive or CDN fetch commonly returns an HTML error page with a
          # 200 status. Fail loudly rather than handing ffmpeg a web page.
          if ! file voice_raw.mp3 | grep -qiE 'audio|mpeg|MP3'; then
            echo "::error::Downloaded file is not audio. First bytes follow."
            head -c 300 voice_raw.mp3 | od -c | head -5
            exit 1
          fi
          ls -la voice_raw.mp3

      - name: Verify the theme exists
        run: |
          set -euo pipefail
          if [ ! -f "${{ inputs.theme }}" ]; then
            echo "::error::Theme not found in repo: ${{ inputs.theme }}"
            exit 1
          fi
          ls -la "${{ inputs.theme }}"

      - name: Mix
        env:
          MIX_ARGS: ${{ inputs.mix_args }}
        run: |
          set -euo pipefail
          # mix_args is free text on a dispatch input, so it is validated against a
          # strict shape before it reaches a command line: long flags and numbers
          # only. A typo is then rejected loudly instead of being pasted into the
          # shell or silently doing nothing.
          if [ -n "${MIX_ARGS}" ]; then
            if ! printf '%s' "${MIX_ARGS}" | grep -qE '^(--[a-z][a-z-]*[[:space:]]+-?[0-9]+(\.[0-9]+)?[[:space:]]*)+$'; then
              echo "::error::mix_args must be '--flag number' pairs only. Got: ${MIX_ARGS}"
              exit 1
            fi
            echo "::warning::Overriding the tuned defaults with: ${MIX_ARGS}"
          fi
          # Unquoted on purpose - the pairs above must split into separate argv
          # entries. The regex is what makes that safe.
          # shellcheck disable=SC2086
          python3 .github/scripts/mix_episode.py \
            --voice voice_raw.mp3 \
            --theme "${{ inputs.theme }}" \
            --out "${{ inputs.asset_id }}_mixed.mp3" \
            --asset-id "${{ inputs.asset_id }}" \
            ${MIX_ARGS}

      - name: Verify the output
        run: |
          set -euo pipefail
          TOTAL=$(python3 -c "import json;print(json.load(open('mix_plan.json'))['total'])")
          VD=$(python3   -c "import json;print(json.load(open('mix_plan.json'))['voice_delay_ms'])")
          VL=$(python3   -c "import json;print(json.load(open('mix_plan.json'))['voice_len'])")
          # Four checks, all inside verify_mix.py: duration against the plan,
          # no mid-stream ID3, beds audible, and no clipping. Kept in the script
          # rather than inline here - embedded python in a YAML block scalar broke
          # this file three times on indentation.
          python3 .github/scripts/verify_mix.py \
            "${{ inputs.asset_id }}_mixed.mp3" "$TOTAL" "$VD" "$VL" 0

      - name: Publish as a release keyed on asset ID
        env:
          ASSET_ID: ${{ inputs.asset_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="crp-audio-${ASSET_ID}"
          # Keyed on asset id, not run id, so the caller fetches its own output by
          # name instead of guessing by timestamp - the failure mode the video
          # watchers still have. Deleting any prior release of the same tag makes
          # a re-run idempotent instead of failing on a duplicate tag.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "${ASSET_ID}_mixed.mp3" \
            --title "CRP Audio Mix - ${ASSET_ID}" \
            --notes "Theme bed mixed around voice. Loudness -16 LUFS / -1.5 dBTP."
          echo "Published release $TAG"

      - name: Upload artifact as a fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crp-audio-${{ inputs.asset_id }}
          path: |
            ${{ inputs.asset_id }}_mixed.mp3
            mix_plan.json
          if-no-files-found: warn
          retention-days: 14

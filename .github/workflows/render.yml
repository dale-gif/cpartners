name: GODTIER Render

on:
  repository_dispatch:
    types: [crp-render]
  workflow_dispatch:
    inputs:
      opusClipUrl:
        description: 'OpusClip signed MP4 URL'
        required: true
      videoId:
        description: 'Video / asset id (used in output filename)'
        required: true
        default: manual-test

permissions:
  contents: write   # required for softprops/action-gh-release

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Inter font
        run: |
          mkdir -p fonts
          curl -fsSL -o /tmp/inter.zip \
            "https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip"
          unzip -q /tmp/inter.zip -d /tmp/inter
          cp /tmp/inter/extras/ttf/Inter-Regular.ttf   fonts/
          cp /tmp/inter/extras/ttf/Inter-Black.ttf     fonts/
          cp /tmp/inter/extras/ttf/Inter-ExtraBold.ttf fonts/

      - name: Install Python deps
        run: |
          pip install --no-cache-dir \
            pillow==10.4.0 \
            requests==2.32.3

      - name: Render
        id: render
        env:
          OPUS_CLIP_URL: ${{ github.event.client_payload.opusClipUrl || inputs.opusClipUrl }}
          VIDEO_ID:      ${{ github.event.client_payload.videoId    || inputs.videoId    }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FONT_DIR: fonts
        run: python render_job.py

      - name: Publish MP4 as GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godtier-${{ github.run_id }}
          name: GODTIER ${{ github.event.client_payload.videoId || inputs.videoId }}
          body: |
            GODTIER-composited video for `${{ github.event.client_payload.videoId || inputs.videoId }}`.
            Source OpusClip URL was signed and expires — file below is the finished MP4.
          files: out/*.mp4
          fail_on_unmatched_files: true

      - name: Summary
        if: always()
        run: |
          echo "## GODTIER Render — ${{ github.event.client_payload.videoId || inputs.videoId }}" >> $GITHUB_STEP_SUMMARY
          echo "- Filename: ${{ steps.render.outputs.filename || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Release: ${{ steps.release.outputs.url || 'n/a' }}" >> $GITHUB_STEP_SUMMARY

name: CRP MF LF Render

on:
  repository_dispatch:
    types: [crp-render]
  workflow_dispatch:
    inputs:
      opusClipUrl:
        description: 'OpusClip signed MP4 URL'
        required: true
      videoId:
        description: 'Video / asset id (used in output filename)'
        required: true
        default: manual-test
      coverUrl:
        description: 'Pre-rendered cover PNG URL. Leave blank and supply coverPlateUrl instead.'
        required: false
        default: ''
      coverPlateUrl:
        description: 'Base plate URL. Supply this and the cover is rendered HERE, in Inter.'
        required: false
        default: ''
      coverHeadline:
        description: 'Cover headline, ALL CAPS, two words is house style'
        required: false
        default: ''
      coverEyebrow:
        description: 'Cover category label'
        required: false
        default: ''
      coverBody:
        description: 'Cover sub-header, one plain sentence'
        required: false
        default: ''
      coverTemplate:
        description: 'T1 Hook / T2 Problem / T3 Solution / T5 Authority'
        required: false
        default: 'T2'
      cardSeconds:
        description: 'How long to hold the title card as frame one'
        required: false
        default: '1'

permissions:
  contents: write   # required for softprops/action-gh-release

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Inter font
        run: |
          mkdir -p fonts
          curl -fsSL -o /tmp/inter.zip \
            "https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip"
          unzip -q /tmp/inter.zip -d /tmp/inter
          find /tmp/inter -type f -name 'Inter-Regular.ttf'   -exec cp {} fonts/ \;
          # Inter-Bold is what render_cover.py sets the eyebrow chip in. Without it the
          # cover step aborts on a missing font.
          find /tmp/inter -type f -name 'Inter-Bold.ttf'      -exec cp {} fonts/ \;
          find /tmp/inter -type f -name 'Inter-Black.ttf'     -exec cp {} fonts/ \;
          find /tmp/inter -type f -name 'Inter-ExtraBold.ttf' -exec cp {} fonts/ \;
          ls -la fonts/

      # Sohne is the brand face. It is a LICENSED font and is NOT in this repo - the receipt on
      # file is a 5-user DESKTOP licence, which does not obviously cover an automated build
      # runner. Once that is settled, drop Sohne-Extrafett/Halbfett/Buch into brand-fonts/ and
      # render_cover.py picks them up on its own. Until then this copies nothing and the render
      # falls back to Inter, so the pipeline never breaks either way.
      - name: Install brand fonts (if licensed and present)
        run: |
          if [ -d brand-fonts ]; then
            cp brand-fonts/*.otf brand-fonts/*.ttf fonts/ 2>/dev/null || true
            echo "brand fonts deployed:"; ls -la fonts/
          else
            echo "no brand-fonts/ in repo - rendering in Inter"
          fi

      - name: Install Python deps
        run: |
          pip install --no-cache-dir \
            pillow==10.4.0 \
            requests==2.32.3

      - name: Render
        id: render
        env:
          OPUS_CLIP_URL: ${{ github.event.client_payload.opusClipUrl || inputs.opusClipUrl }}
          VIDEO_ID:      ${{ github.event.client_payload.videoId    || inputs.videoId    }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FONT_DIR: fonts
        run: python render_job.py

      # Draw the cover HERE rather than in n8n. n8n Cloud carries only the MS core fonts and
      # cannot have any installed, which capped covers at Arial Black. This runner already has
      # Inter, so the covers and the on-screen video text finally share one typeface. Swapping to
      # a licensed Sohne later is a font-dir change, nothing more.
      - name: Render cover
        id: cover
        env:
          PLATE:    ${{ github.event.client_payload.coverPlateUrl || inputs.coverPlateUrl }}
          HEADLINE: ${{ github.event.client_payload.coverHeadline || inputs.coverHeadline }}
          EYEBROW:  ${{ github.event.client_payload.coverEyebrow  || inputs.coverEyebrow }}
          BODY:     ${{ github.event.client_payload.coverBody     || inputs.coverBody }}
          TEMPLATE: ${{ github.event.client_payload.coverTemplate || inputs.coverTemplate }}
          VIDEO_ID: ${{ github.event.client_payload.videoId || inputs.videoId }}
        run: |
          mkdir -p out
          if [ -z "${PLATE:-}" ]; then
            echo "No coverPlateUrl - skipping cover render."
            exit 0
          fi
          if [ -z "${HEADLINE:-}" ]; then
            echo "coverPlateUrl supplied but no coverHeadline - refusing to render a blank cover." >&2
            exit 1
          fi
          OUT="out/${VIDEO_ID}_CRP_COVER.png"
          python scripts/render_cover.py             --plate "${PLATE}" --out "${OUT}"             --headline "${HEADLINE}" --eyebrow "${EYEBROW}" --body "${BODY}"             --template "${TEMPLATE:-T2}" --font-dir fonts
          echo "cover_path=${OUT}" >> $GITHUB_OUTPUT
          echo "Rendered ${OUT}"

      # Frame one. Holds the CRP cover at the very start of the video so a platform that will
      # not take an uploaded cover file still opens on branded artwork. No coverUrl in the
      # payload means this is a no-op and the video is published exactly as before.
      - name: Prepend title card (frame one)
        env:
          COVER_URL:    ${{ github.event.client_payload.coverUrl || inputs.coverUrl }}
          CARD_SECONDS: ${{ github.event.client_payload.cardSeconds || inputs.cardSeconds }}
          TARGET:       ${{ steps.render.outputs.output_path }}
        run: |
          # A cover rendered in this run wins over a pre-rendered URL.
          LOCAL="${{ steps.cover.outputs.cover_path }}"
          if [ -n "${LOCAL:-}" ] && [ -f "${LOCAL}" ]; then
            COVER_URL="${LOCAL}"
            echo "Using the cover rendered in this run: ${LOCAL}"
          fi
          if [ -z "${COVER_URL:-}" ]; then
            echo "No cover supplied - skipping title card, publishing video unchanged."
            exit 0
          fi
          if [ -z "${TARGET:-}" ] || [ ! -f "${TARGET}" ]; then
            echo "Render produced no output_path - nothing to prepend to." >&2
            exit 1
          fi
          chmod +x scripts/prepend_title_card.sh
          scripts/prepend_title_card.sh "${TARGET}" "${COVER_URL}" "${CARD_SECONDS:-1}" "${TARGET%.mp4}__carded.mp4"
          mv "${TARGET%.mp4}__carded.mp4" "${TARGET}"
          echo "Title card baked into ${TARGET}"

      - name: Bundle debug assets
        if: always()
        run: |
          mkdir -p out
          cp work/*.png       out/ 2>/dev/null || true
          cp work/plan.json   out/ 2>/dev/null || true

      - name: Publish MP4 + debug assets as GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: crp-render-${{ github.run_id }}
          name: CRP MF LF Render — ${{ github.event.client_payload.videoId || inputs.videoId }}
          body: |
            CRP MF LF Render output for `${{ github.event.client_payload.videoId || inputs.videoId }}`.
            Attached: final 1080p MP4 + intermediate overlay PNGs + plan.json.
            Triggered by run id `${{ github.run_id }}`.
          files: |
            out/*.mp4
            out/*.png
            out/plan.json
          fail_on_unmatched_files: false

      - name: Summary
        if: always()
        run: |
          echo "## CRP MF LF Render — ${{ github.event.client_payload.videoId || inputs.videoId }}" >> $GITHUB_STEP_SUMMARY
          echo "- Filename: ${{ steps.render.outputs.filename || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Release: ${{ steps.release.outputs.url || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
